name: ci

# The push to main is what gives a new PR a cache to start from: a PR can only
# restore caches saved by itself or by the default branch, so without it every
# PR's first run compiled every dependency from scratch.
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".config/nextest.toml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "build.rs"
      - "assets/windows/**"
      - "compose.yaml"
      - "dev/**"
      - ".config/nextest.toml"
      - ".github/workflows/ci.yml"

# Only main saves: the repository gets 10 GB of cache, and every job on every
# branch saving its own 0.5-2 GB copy evicted main's within the hour, so most
# runs started cold. PRs still restore main's.
#
# The vendored crates under vendor/ rebuild on every run: rust-cache drops
# every crate inside the checkout from what it saves, and cargo judges a path
# crate fresh by file mtimes, which a checkout renews anyway. rust-cache would
# keep them only as workspace members, which pulls their dev-dependencies into
# Cargo.lock; a non-path source (a git dependency) avoids both.
# Nothing here pushes or comments; build scripts and proc macros from a PR run
# with whatever token the job holds.
permissions:
  contents: read

# Cargo.toml compiles dependencies at opt-level 3 so the dev app keeps its frame
# rate; CI draws no frames, and those optimized, debuginfo-laden builds are most
# of a cold run's hour and of each job's cache. No environment variable reaches
# `[profile.dev.package."*"]`, so every job writes that override into a
# .cargo/config.toml above the checkout (macOS runners have no ~/.cargo); Cargo
# reads config from parent directories, and it takes precedence over the
# manifest. rust-cache keys on CARGO_* variables but not on that file: change
# the override and the variable below together, or main keeps restoring caches
# built the old way.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  # insta lets either variable rewrite or force-pass a snapshot, and CI must
  # fail on any difference instead.
  INSTA_UPDATE: "no"
  INSTA_FORCE_PASS: "0"

# Not on main: a run there cancelled by the next merge never reaches
# rust-cache's save, and the slowest job is the one that loses it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One job, so one cache. No `cargo build` step: `cargo test` compiles and links
# the crate, clippy checks what only the app builds, and the release workflow
# builds the binary that ships. macOS runners have no Docker, so the live tests
# do not run here.
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: fmt
        run: cargo fmt --check
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: dependencies unoptimized
        run: mkdir -p ../.cargo && printf '[profile.dev.package."*"]\nopt-level = 0\n' >> ../.cargo/config.toml
        shell: bash
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
